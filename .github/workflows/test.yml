name: Test
on:
  push:
    branches: [v4.3.x]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rabbitmq: [v4.3.6]
    steps:
      - uses: actions/checkout@v4
      - name: Build against RabbitMQ ${{ matrix.rabbitmq }}
        run: scripts/build.sh ${{ matrix.rabbitmq }}
      - name: Smoke test
        run: RABBITMQ_IMAGE="rabbitmq:${MATRIX_RABBITMQ#v}-management" scripts/smoke-test.sh
        env:
          MATRIX_RABBITMQ: ${{ matrix.rabbitmq }}
      - uses: actions/upload-artifact@v4
        with:
          name: rabbitmq_delayed_message_exchange-${{ matrix.rabbitmq }}
          path: dist/
